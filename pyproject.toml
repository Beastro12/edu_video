[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "live: calls paid APIs (ElevenLabs, Google, Anthropic). Excluded from make check.",
    "live_veo: one paid Veo clip (~EUR 3). Opt-in only: pytest -m live_veo tests/test_live.py",
]
addopts = "-m 'not live and not live_veo'"
