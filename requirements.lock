# requirements.lock: exact versions of the environment `make check` passes in (P1-11).
# Made on Linux, Python 3.11.15, from the working venv (pip install -r requirements.txt
# -r requirements-dev.txt), then:  pip freeze --exclude-editable   (the pins below).
# Install:  pip install -r requirements.lock      (one lock: runtime and dev tools)
# Upgrade on purpose: install the new versions, run `make check`, then regenerate (keeps this header):
#   { grep '^#' requirements.lock; pip freeze --exclude-editable; } > requirements.lock.new && mv requirements.lock.new requirements.lock
# Regenerate only on Linux with Python 3.11, in a venv installed from the ranges and nothing else:
# frozen on macOS, it would pin macOS-only packages (pyobjc, via screeninfo) and break Linux installs.
# requirements.txt and requirements-dev.txt keep the ranges. tests/test_lock.py checks that this
# lock satisfies them and that the installed versions equal these pins.
